</div>
<!-- Editorial Main Heading & Civic Subtitle -->
<div class="space-y-space-xs mb-space-lg text-left">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">
        Find out who is responsible for your street.
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant pt-1 leading-relaxed">
        Your neighborhood. The right authority. A clearer way to get things moving.
      </p>
</div>
<!-- Authentication Form Elements -->
<form class="flex flex-col space-y-space-md" onsubmit="event.preventDefault();">
<!-- Email Address Input -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="civic-email">
          Email address
        </label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-lowest text-primary font-body-md text-body-md rounded-xl py-3.5 pl-4 pr-11 shadow-sm placeholder:text-outline focus:outline-none focus:bg-surface-container-low transition-all duration-150" id="civic-email" name="email" placeholder="you@example.com" type="email"/>
<div class="absolute right-3.5 flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="civic-password">
          Password
        </label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-lowest text-primary font-body-md text-body-md rounded-xl py-3.5 pl-4 pr-11 shadow-sm placeholder:text-outline focus:outline-none focus:bg-surface-container-low transition-all duration-150" id="civic-password" name="password" placeholder="Enter your password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3.5 flex items-center justify-center text-secondary hover:text-primary transition-colors p-1" id="toggle-password-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">visibility_off</span>
</button>
</div>
<!-- Forgot Password Secondary Link -->
<div class="flex justify-end pt-1">
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors" href="#">
            Forgot password?
          </a>
</div>
</div>
<!-- Primary Action CTA Button -->
<button class="w-full bg-primary-container text-on-primary font-label-lg text-label-lg py-3.5 px-6 rounded-xl flex items-center justify-center space-x-2 shadow-md active:scale-[0.99] transition-transform duration-150 mt-space-xs" type="submit">
<span>Log in</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Visual Subtle Divider -->

<button class="w-full bg-surface-container-lowest text-primary font-label-lg text-label-lg py-3.5 px-4 rounded-xl flex items-center justify-center space-x-3 shadow-sm active:bg-surface-container-low transition-colors duration-150" type="button">

<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
<!-- Footer Register Prompt -->
<div class="mt-space-lg mb-space-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
        New to CivicRoute? 
        <a class="font-label-md text-label-md text-primary font-bold hover:underline ml-1" href="#">
          Sign up
        </a>
</p>
</div>
</div>
</div>
<script>
  (function() {
    // Password visibility toggle interaction
    const toggleBtn = document.getElementById('toggle-password-btn');
    const passwordInput = document.getElementById('civic-password');
    const toggleIcon = document.getElementById('password-toggle-icon');

    if (toggleBtn && passwordInput && toggleIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
      });
    }

    // Language toggle pills state micro-interaction
    const btnEn = document.getElementById('btn-lang-en');
    const btnUr = document.getElementById('btn-lang-ur');

    if (btnEn && btnUr) {
      btnEn.addEventListener('click', function() {
        btnEn.className = 'px-3 py-1 rounded-full font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm font-semibold';
        btnUr.className = 'px-3 py-1 rounded-full font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-primary';
      });

      btnUr.addEventListener('click', function() {
        btnUr.className = 'px-3 py-1 rounded-full font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm font-semibold';
        btnEn.className = 'px-3 py-1 rounded-full font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-primary';
      });
    }
  })();
</script></main></body></html>
